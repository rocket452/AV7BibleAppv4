<!DOCTYPE html>
<html>
<head>
    <title>The AV7 Invitation Bible</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" href="../CSS/styles.css">

	<style type="text/css">
		h1 {
			text-align: center;
		}

		body,
		body *,
		.text-container,
		.text-container *,
		.T1 {
			font-size: 14pt !important;
		}

		.img1 {
			width: 142px;
			float: left;
		}

		.img2 {
			width: 60%;
			float: left;
		}

		.banner {
			background-color: #000000;
			overflow: hidden;
			padding: 10px 3px;
		}

		#innerTable {
			margin-top: 12px;
		    width: 45%;
            max-width: 600px;
		}

		#footer {
			border: solid black;
		}

		@media (max-width: 600px) {
			body {
				margin: 0;
				padding: 0;
				font-size: 13pt !important;
			}

			.main {
				width: 100%;
			}

			.img1 {
				width: 40%;
			}

			.img2 {
				width: 60%;
			}

			#innerTable {
				width: 100%;
				height: 100%;
				border: none;
				margin: 0px;
			}

			#footer {
				border: 3px solid black;
				font-size: larger;
			}

			.text-container {
				height: 100vh;
				width:auto;
				overflow: auto; /* Changed to auto to allow scrolling */
			}
		}

		.text-container {
			height: 525px;
			overflow: auto;
			padding: 20px 5px 5px 5px;
	//
		}

		#chapterSelectTable td {
			padding: 2px;
			text-align: center;
			border: 3px solid black;
		}

		#chapterSelectTable td,
		#chapterSelectTable td a {
			font-size: 14pt !important;
		}

		.whyPage,
		.keysPage {
			background-color: #4682B4;
			width: 40px;
		}

		.whyPage {
			background: blue;
		}

		.whyPage a {
			color: white !important;
			font-weight: bold;
		}

		.keysPage {
			background-color: #F1C22C;
		}

		.keysPage a {
			color: black !important;
		}
	</style>

    <script src="https://ajax.googleapis.com/ajax/libs/jquery/1.11.2/jquery.min.js"></script>
    <script src="../JS/javascript.js"></script>
    <script>

        function insertHeader(input) {
            document.getElementById("headerContent").innerHTML = input;
        }

        function insertTable(input) {
            document.getElementById("chapterSelectTable").innerHTML = input;
        }

        function insertBody(input) {
            var textElement = document.createElement("span");
            textElement.innerHTML = input;
            document.getElementById("mainContent").appendChild(textElement);
        }
    </script>
</head>

<body bgcolor="#000000" background="../images/avbackground.jpg">
    <table border="0" cols="1" width="100%" height="100%" align="center" style="border-spacing:inherit">
        <tr>
            <td>
                <center>
                    <table id="innerTable" border="3" cellspacing="0" cellpadding="0">
                        <tr valign="top">
                            <td bgcolor="#F6EFE6" background="../images/linenbackz.jpg">
                                <div class="banner">
                                    <a href="../index.htm">
                                        <img src="file:///android_asset/images/av7icon.jpg" border="none" class="img1">
                                    </a>
                                    <a href="../av7toc.htm">
                                        <img src="file:///android_asset/images/tibicon.jpg" align="top" class="img2">
                                    </a>
                                </div>

                                <div class="text-container">
                                    <div id="headerContent"></div>
                                    <p>
                                        <center>
                                            <table id='chapterSelectTable'></table>
                                        </center>
                                    </p>
                                    <div id="mainContent"></div>
                                </div>

                                <center>
                                    <div id="footer"></div>
                                </center>
                            </td>
                        </tr>
                    </table>
                </center>
            </td>
        </tr>
    </table>
</body>
</html>
